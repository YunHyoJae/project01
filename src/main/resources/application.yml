server :
  port : 8080
spring :
  application :
    name : project
  devtools :
    livereload :
      enabled: true
    restart:
      enabled: true
  profiles:
    active: dev
    default: dev
  servlet:
    multipart:
      enabled: true
      max-file-size : 100MB #???? ???
      max-request-size : 1000MB #??? ?? ? ?? ???
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
      ddl-auto: update # update create ????? ??? update? ???
    defer-datasource-initialization: true
  output :
    ansi :
      enabled : always

logging :
  level :
    root : info
    org :
      hibernate :
        sql : debug
      springframework :
        security : DEBUG
