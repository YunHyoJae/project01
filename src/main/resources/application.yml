server :
  port : 8080
spring :
  application :
    name : project
  security:
    user:
      name: user
      password: 1234
      roles: ADMIN
  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    url: jdbc:oracle:thin:@localhost:1521:xe
    username: test01
    password: "12345"
  devtools :
    livereload :
      enabled: true
    restart:
      enabled: true
  profiles:
    active: dev
  servlet:
    multipart:
      enabled: true
      max-file-size : 100MB #???? ???
      max-request-size : 1000MB #??? ?? ? ?? ???
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
      ddl-auto: create # update create
  output :
    ansi :
      enabled : always

logging :
  level :
    root : info
    org :
      hibernate :
        sql : debug
      springframework :
        security : DEBUG
