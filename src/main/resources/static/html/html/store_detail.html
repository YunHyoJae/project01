<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>매장상세</title>
</head>
<body>
  <!-- 본문 컨텐츠 -->
  <div class="storeStatus">
    <h2>매장 현황</h2>
    <button type="submit" class="default_btn new_btn">신규입점 등록</button>
    <div class="storeStatus-box box">
      <div>
        <label for="person_name">성함 <input type="text" id="person_name"></label>
        <label for="person_address">주소 <input type="text" id="person_address"></label>
        <label for="phoneNum">연락처 <input type="text" id="phoneNum"></label>
      </div>
      <div>
        <label for="store_name">매장명 <input type="text" id="store_name"></label>
        <label for="store_address">주소 <input type="text" id="store_address"></label>
        <label for="callNum">매장 전화번호 <input type="text" id="callNum"></label>
        <label for="dayOff">휴업 설정 <input type="checkbox" id="dayOff"></label>
      </div>
      <div>
        <label for="addFile">첨부파일 <input type="text" id="addFile"></label>
        <label for="agree">
          <input type="checkbox" id="agree">
          정보수정은 증빙서류를 첨부해주시면 검토 후 연락드립니다.
        </label>
      </div>
    </div>
  </div>
</body>
</html>
