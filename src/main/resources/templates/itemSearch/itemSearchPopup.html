<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>품목 검색</title>
    <script>
        function selectItem(code, name, supplier) {
            // 부모 창의 receiveSelectedItem 함수 호출
            window.opener.receiveSelectedItem(code, name, supplier);
            window.close();
        }
    </script>
</head>
<body>
<h2>품목 검색</h2>

<table border="1">
    <thead>
    <tr>
        <th>품목코드</th>
        <th>품목명</th>
        <th>거래처</th>
        <th>선택</th>
    </tr>
    </thead>
    <tbody>
    <!-- 예시 데이터. 서버 데이터로 대체 가능 -->
    <tr>
        <td>ITEM001</td>
        <td>콜드브루 원액</td>
        <td>카페서플라이</td>
        <td><button type="button" onclick="selectItem('ITEM001', '콜드브루 원액', '카페서플라이')">선택</button></td>
    </tr>
    <tr>
        <td>ITEM002</td>
        <td>컵홀더</td>
        <td>패키징코리아</td>
        <td><button type="button" onclick="selectItem('ITEM002', '컵홀더', '패키징코리아')">선택</button></td>
    </tr>
    <!-- 여기에 th:each 등을 써서 동적 목록으로 변경 가능 -->
    </tbody>
</table>

</body>
</html>
