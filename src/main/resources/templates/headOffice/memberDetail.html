<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{/headOffice/meta::myHead('멤버 및 스토어 등록')}"></head>
<body>
<header th:replace="~{/headOffice/tnb}"></header>
<div class="section">
  <div th:replace="~{/headOffice/header}"></div>
  <div class="main-layout">
    <div th:replace="~{/headOffice/etcLnb::active('etc','member')}"></div>

    <div class="form-wrapper">
      <h2>정보수정</h2>
      <form class="editProfile" action="/headOffice/memberDetail" method="post" th:object="${dto}">
        <input type="hidden" th:field="*{storeId}" readonly/>
        <input type="hidden" th:field="*{memberId}" readonly/>
        <input type="hidden" th:field="*{userPw}" /><!--초기비밀번호-->
        <div class="form-row two-columns-split">
          <!-- 왼쪽: 사용자 정보 -->
          <div>
            <div class="form-row">
              <label>아이디</label>
              <input type="text" th:field="*{userId}" readonly/>
              <label>이메일</label>
              <input type="text" th:field="*{userEmail}"/>
            </div>
            <div class="form-row">
              <label>고객명</label>
              <input type="text" th:field="*{userName}" />
              <label>연락처</label>
              <input type="text" th:field="*{userTel}" />
            </div>
            <p class="error" th:errors="*{userName}"></p>
            <p class="error" th:errors="*{userTel}"></p>

            <div class="form-row three-columns">
              <label for="user-postcode">우편번호</label>
              <input type="text" id="user-postcode" placeholder="우편번호" th:field="*{userZipcode}" readonly>
              <input type="button" onclick="execDaumPostcode('user')" value="주소 검색"/>
            </div>

            <div class="form-row address-combined">
              <label for="user-address">주소</label>
              <div class="address-group">
                <input type="text" id="user-address" placeholder="기본 주소" th:field="*{userAddress01}" readonly>
                <input type="text" id="user-detail-address" th:field="*{userAddress02}" placeholder="상세 주소를 입력하세요">
              </div>
            </div>
          </div>

          <!-- 오른쪽: 매장 정보 -->
          <div>
            <div class="form-row three-columns">
              <label>매장명</label>
              <input type="text" placeholder="매장명" th:field="*{name}" />
              <label>사업자등록번호</label>
              <input type="text" placeholder="사업자등록번호" th:field="*{storeNumber}" />
            </div>
            <p class="error" th:errors="*{name}"></p>

            <div class="form-row">
              <label>매장 전화번호</label>
              <input type="text" placeholder="매장전화번호" th:field="*{tel}" />
              <label>점포위치</label>
              <input type="text" placeholder="점포위치" th:field="*{space}" />
            </div>
            <p class="error" th:errors="*{space}"></p>

            <div class="form-row three-columns">
              <label for="store-postcode">우편번호</label>
              <input type="text" id="store-postcode" placeholder="우편번호" th:field="*{zipcode}" readonly />
              <input type="button" onclick="execDaumPostcode('store')" value="주소 검색"/>
            </div>

            <div class="form-row">
              <label for="store-address">주소</label>
              <input type="text" id="store-address" placeholder="기본 주소" th:field="*{address01}" readonly />
              <label for="store-detail-address">상세 주소</label>
              <input type="text" id="store-detail-address" th:field="*{address02}" placeholder="상세 주소를 입력하세요" />
            </div>

            <div class="form-row checkbox-row">
              <label>휴업 설정</label>
              <label class="checkbox-label">
                <input type="checkbox" th:field="*{stateBoolean}" th:checked="${stateBoolean}" />
                휴업 또는 폐업 설정
              </label>

            </div>

          </div>
        </div>

        <!-- 이하 기존 구조 유지
        <div class="form-row">
          <label>첨부파일</label>
          <input type="file">
          <small>정보수정은 증빙서류를 첨부해주시면 검토 후 연락드립니다.</small>
        </div> -->

        <div class="form-actions">
          <button type="button" class="cancel" onclick="window.history.back()">목록</button>
          <button type="submit" class="submit">수정</button>
        </div>

      </form>
    </div>
  </div>
</div>
<script defer>
  function apiStoreName(){

  }
</script>
</body>
</html>
