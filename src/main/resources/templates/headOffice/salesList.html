<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{/headOffice/meta::myHead('매장별 매출 현황')}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>매장별 매출 현황</title>
    <link rel="stylesheet" href="/css/headOffice.css">
</head>

<script th:if="${param.alert}" th:inline="javascript">
    alert([[${param.alert}]]);
</script>


<body>
<header th:replace="~{/headOffice/tnb}"></header>
<div class="section">
    <div th:replace="~{/headOffice/header}"></div>
    <div class="main-layout">
        <div th:replace="~{/headOffice/etcLnb::active('sale','salesList')}"></div>
        <div class="content">


            <div class="inventorySalesStatus sales-status">
                <h2>매장별 매출 현황</h2>
                <div class="filter-section">
                    <!-- 조회 조건 -->
                    <form th:action="@{/headOffice/salesList}" method="get">

                        <div>
                            <label>매장:
                                <select name="storeId" required>
                                    <option value="" disabled selected>매장을 선택하세요</option>
                                    <option th:each="store : ${storeList}"
                                            th:value="${store.id}"
                                            th:text="${store.name + ' (' + store.id + ')'}">
                                    </option>
                                </select>
                            </label>

                            <label>시작일:
                                <input type="date" name="startDate"
                                       th:value="${#dates.format(startDate, 'yyyy-MM-dd')}">
                            </label>

                            <label>종료일:
                                <input type="date" name="endDate" th:value="${#dates.format(endDate, 'yyyy-MM-dd')}">
                            </label>
                            <button class="search-btn default_btn ml-10" type="submit">조회</button>
                        </div>
                    </form>
                </div>


                <!-- 매출 현황 -->
                <table class="status-table">
                    <thead>
                    <tr>
                        <th>매장 ID</th>
                        <th>매장명</th>
                        <th>메뉴 ID</th>
                        <th>메뉴명</th>
                        <th>총판매수량</th>
                        <th>매출액</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="summary : ${summaryList}">
                        <td th:text="${summary.storeId}"></td>
                        <td th:text="${summary.storeName}"></td>
                        <td th:text="${summary.menuId}"></td>
                        <td th:text="${summary.menuName}"></td>
                        <td th:text="${summary.totalQuantity}"></td>
                        <td th:text="${#numbers.formatInteger(summary.totalAmount, 3, 'COMMA')}"></td>
                    </tr>
                    </tbody>
                    <tbody>
                    <tr>
                        <td>합계</td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td th:text="${totalQuantity}"></td>
                        <td th:text="${#numbers.formatInteger(totalAmount, 0, 'COMMA')}"></td>
                    </tr>
                    </tbody>
                </table>

                <br/>

                <!-- 🧾 판매 입력 폼 -->
                <div class="input-section">
                    <div><label>판매입력</label></div>
                <form th:action="@{/headOffice/salesInput}" method="post">
                    <input type="hidden"
                           th:if="${_csrf != null}"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}"/>
                        <label>매장:
                            <select name="storeId" required>
                                <option value="" disabled selected>매장을 선택하세요</option>
                                <option th:each="store : ${storeList}"
                                        th:value="${store.id}"
                                        th:text="${store.name + ' (' + store.id + ')'}">
                                </option>
                            </select>
                        </label>

                        <label>판매 시간:
                            <input type="datetime-local" name="saleTime">
                        </label>

                        <label>메뉴:
                            <select name="menuId" required>
                                <option value="" disabled selected>메뉴를 선택하세요</option>
                                <option th:each="menu : ${menuList}"
                                        th:value="${menu.menuId}"
                                        th:text="${menu.menuName + ' (' + menu.menuId + ') - ' + #numbers.formatInteger(menu.menuPrice, 0, 'COMMA') + '원'}">
                                </option>
                            </select>
                        </label>

                        <label>수량:
                            <input type="number" name="quantity" min="1" required>
                        </label>

                        <button type="submit" class="default_btn ml-10">입력</button>
                </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
