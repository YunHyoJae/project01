<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{/headOffice/meta::myHead('재고')}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>매장 재고현황</title>
    <link rel="stylesheet" href="/css/headOffice.css">
</head>

<style>
    .low-stock {
        background-color: red;
        color: white;
        font-weight: bold;
    }

    table {
        border-collapse: collapse;
    }

    td, th {
        padding: 8px;
        border: 1px solid #ccc;
        text-align: center;
    }

    .table-viewport2 {
        width: 100%;
        max-height: 480px; /* 필요에 따라 높이 조정 */
        overflow-x: scroll;
        overflow-y: auto; /* 세로 스크롤 허용 */
        border-radius: 10px;
        display: block;
    }

    .stock-table2 {
        border-collapse: collapse;
        width: max-content; /* 테이블 너비를 콘텐츠 기준으로 설정 */
        min-width: 1200px; /* 테이블 최소 너비 설정 */
        max-width: none; /* 최대 너비 제한 해제 */
        table-layout: fixed; /* 테이블 너비 고정 */
        margin-bottom: 0;
    }

    .stock-table2 thead th {
        position: sticky;
        background-color: #F0F0F0;
        white-space: nowrap; /* 매장명이 줄바꿈되지 않도록 */
    }

    .stock-table2 th, .stock-table2 td {
        min-width: 150px;
        max-width: 200px;
        text-align: center;
        padding: 8px;
    }

    .stock-table2 thead th {
        position: sticky !important; /* 우선순위 강화 */
        top: 0 !important;
        z-index: 100 !important;
        background-color: #F0F0F0 !important;
        white-space: nowrap !important; /* 텍스트 줄바꿈 방지 */
    }

    .stock-table2 th:first-child,
    .stock-table2 td:first-child {
        position: sticky;
    }

    .stock-table2 th:nth-child(2),
    .stock-table2 td:nth-child(2) {
        position: sticky;
    }

    .stock-table2 th:nth-child(3),
    .stock-table2 td:nth-child(3) {
        position: sticky;
    }

    .table-wrapper {
        display: flex;
        border: 1px solid #ccc;
        border-radius: 8px;
        overflow: hidden;
    }

    .fixed-table {
        flex: 0 0 300px;
        background-color: #f9f9f9;
        border-right: 1px solid #ccc;
    }

    .scrollable-table {
        overflow-x: auto;
        width: 100%;
    }

    .fixed-table table,
    .scrollable-table table {
        border-collapse: collapse;
        width: 100%;
    }

    th, td {
        padding: 8px;
        border: 1px solid #ccc;
        text-align: center;
        white-space: nowrap;
    }



</style>
<body>
<header th:replace="~{/headOffice/tnb}"></header>
<div class="section">
    <div th:replace="~{/headOffice/header}"></div>
    <div class="main-layout">
        <div th:replace="~{/headOffice/etcLnb::active('inventory','inventoryStore')}"></div>
        <div class="content">

            <div class="inventoryStatus">
                <h2>매장별 재고현황</h2>
                <div class="search-bar">
                    <form th:action="@{/headOffice/inventoryStore}" method="get" oninput="updateSearchTarget()">
                        <label>
                            <select id="searchType" name="searchType" onchange="updateSearchTarget()">
                                <option value="itemName" th:selected="${searchType == 'itemName'}">품목명</option>
                                <option value="storeName" th:selected="${searchType == 'storeName'}">매장명</option>
                            </select>
                        </label>

                        <input type="text" id="searchInput" name="itemName" th:value="${itemName}" placeholder="검색어 입력">

                        <button type="submit">검색</button>
                    </form>
                </div>

                <script>
                    function updateSearchTarget() {
                        const type = document.getElementById("searchType").value;
                        const input = document.getElementById("searchInput");
                        if (type === 'itemName') {
                            input.name = 'itemName';
                        } else {
                            input.name = 'storeName';
                        }
                    }

                    document.addEventListener("DOMContentLoaded", updateSearchTarget);
                </script>


                <!-- 🔽 테이블 -->

                <!--                <div class="table-viewport2">-->
                <!--                    <table class="stock-table2">-->
                <!--                        <thead>-->
                <!--                        <tr>-->
                <!--                            <th>품목코드</th>-->
                <!--                            <th>품목명</th>-->
                <!--                            &lt;!&ndash; 각 매장명을 반복적으로 열로 출력 &ndash;&gt;-->
                <!--                            <th th:each="store : ${storeList}" th:text="${store.name}">매장명</th>-->
                <!--                        </tr>-->
                <!--                        </thead>-->

                <!--                        <tbody>-->
                <!--                        <tr th:each="row : ${pivotList}">-->
                <!--                            <td th:text="${row.itemCode}"></td>-->
                <!--                            <td th:text="${row.itemName}"></td>-->
                <!--                            &lt;!&ndash; 각 매장에 대한 재고 수량 출력 &ndash;&gt;-->
                <!--                            <td th:each="store : ${storeList}"-->
                <!--                                th:text="${row.getStockByStoreId(store.id)}"-->
                <!--                                th:class="${row.getStockCssClass(store.id)}">-->
                <!--                            </td>-->
                <!--                        </tr>-->
                <!--                        </tbody>-->
                <!--                    </table>-->
                <div class="table-wrapper">
                    <!-- 왼쪽 고정 열 -->
                    <div class="fixed-table">
                        <table>
                            <thead>
                            <tr>
                                <th>품목코드</th>
                                <th>품목명</th>
                                <th>본사</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="row : ${pivotList}">
                                <td th:text="${row.itemCode}"></td>
                                <td th:text="${row.itemName}"></td>
                                <td th:text="${row.getStockByStoreId(1)}"></td> <!-- 101 = 본사 -->
                            </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- 오른쪽 가변 열 (매장별 재고) -->
                    <div class="scrollable-table">
                        <table>
                            <thead>
                            <tr>
                                <th th:each="store : ${storeList}" th:if="${store.id != 1}"
                                    th:text="${store.name}"></th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="row : ${pivotList}">
                                <td th:each="store : ${storeList}" th:if="${store.id != 1}"
                                    th:text="${row.getStockByStoreId(store.id)}"
                                    th:class="${row.getStockCssClass(store.id)}"></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>


            </div>
        </div>
    </div>
</div>
</div>
</body>
</html>
