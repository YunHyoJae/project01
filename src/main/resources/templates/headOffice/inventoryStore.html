<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{/headOffice/meta::myHead('재고')}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>매장 재고현황</title>
    <link rel="stylesheet" href="/css/headOffice.css">
</head>

<style>
    .low-stock {
        background-color: red;
        color: white;
        font-weight: bold;
    }

    .content {
        overflow-x: auto; !important;   /* 가로 스크롤 허용 */
    }

    .table-wrapper {
        display: flex;
        overflow: auto;       /* ✅ 여기에서만 스크롤을 맡깁니다 */
        max-height: 600px;
        border: 1px solid #ccc;
    }

    .table-container {
        display: flex;
        position: relative;
    }

    .fixed-table {
        position: sticky;
        left: 0;
        z-index: 2;
        background-color: #f4f4f4;
        border-right: 1px solid #7a7a7a;
        width: max-content; /* 너비를 자동으로 줄이기 위해 추가 */
    }

    .scrollable-table-wrapper {
        /* ✅ 스크롤 제거 */
        overflow: unset;
        max-height: unset;
    }

    .scrollable-table {
        min-width: 600px;
        border-collapse: collapse;
    }

    table {
        border-collapse: collapse;
    }

    th, td {
        padding: 8px;
        border: 1px solid #737373;
        text-align: center;
        white-space: nowrap;
    }

    thead th {
        position: sticky;
        top: 0;
        background-color: #e3e3e3;
        z-index: 3;
    }

    .fixed-table thead th {
        position: sticky;
        top: 0;
        background-color: #e3e3e3;
        z-index: 10;
    }

    .scrollable-table thead th {
        position: sticky;
        top: 0;
        background-color: #e3e3e3;
        z-index: 1; /* 반드시 낮게 설정 */
    }

</style>

<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<header th:replace="~{/headOffice/tnb}"></header>
<div class="section">
    <div th:replace="~{/headOffice/header}"></div>
    <div class="main-layout">
        <div th:replace="~{/headOffice/etcLnb::active('inventory','inventoryStore')}"></div>
        <div class="content">

            <div class="inventoryStatus">
                <h2>매장별 재고현황</h2>
                <div class="search-bar">
                    <form th:action="@{/headOffice/inventoryStore}" method="get" oninput="updateSearchTarget()">
                        <label>
                            <select id="searchType" name="searchType" onchange="updateSearchTarget()">
                                <option value="itemName" th:selected="${searchType == 'itemName'}">품목명</option>
                                <option value="storeName" th:selected="${searchType == 'storeName'}">매장명</option>
                            </select>
                        </label>

                        <input type="text" id="searchInput" name="itemName" th:value="${itemName}" placeholder="검색어 입력">

                        <button type="submit">검색</button>
                        <button type="button" onclick="downloadExcel()">엑셀 다운로드</button>
                    </form>

                </div>

                <script>
                    function updateSearchTarget() {
                        const type = document.getElementById("searchType").value;
                        const input = document.getElementById("searchInput");
                        if (type === 'itemName') {
                            input.name = 'itemName';
                        } else {
                            input.name = 'storeName';
                        }
                    }

                    document.addEventListener("DOMContentLoaded", updateSearchTarget);
                </script>

                <script>
                    function syncRowHeights() {
                        const fixedRows = document.querySelectorAll('.fixed-table tbody tr');
                        const scrollableRows = document.querySelectorAll('.scrollable-table tbody tr');

                        for (let i = 0; i < fixedRows.length; i++) {
                            const fixedRow = fixedRows[i];
                            const scrollableRow = scrollableRows[i];
                            if (fixedRow && scrollableRow) {
                                const height = Math.max(
                                    fixedRow.getBoundingClientRect().height,
                                    scrollableRow.getBoundingClientRect().height
                                );
                                fixedRow.style.height = height + 'px';
                                scrollableRow.style.height = height + 'px';
                            }
                        }
                    }

                    window.addEventListener('DOMContentLoaded', syncRowHeights);
                    window.addEventListener('resize', syncRowHeights);
                </script>

                <script>
                    window.addEventListener('DOMContentLoaded', function () {
                        const table = document.getElementById('scrollTable');
                        if (table) {
                            table.style.width = '1000px'; // 👈 강제 너비 설정
                        }
                    });
                </script>


                <div class="table-wrapper">
                    <div class="table-container">

                        <!-- 왼쪽 고정 테이블 -->
                        <table class="fixed-table">
                            <thead>
                            <tr>
                                <th>품목코드</th>
                                <th>품목명</th>
                                <th>본사</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="row : ${pivotList}">
                                <td th:text="${row.itemCode}"></td>
                                <td th:text="${row.itemName}"></td>
                                <td th:text="${row.getStockByStoreId(1)}"></td>
                            </tr>
                            </tbody>
                        </table>

                        <!-- 오른쪽 스크롤 테이블 -->
                        <div class="scrollable-table-wrapper">
                            <table class="scrollable-table">
                                <thead>
                                <tr>
                                    <th th:each="store : ${storeList}" th:if="${store.id != 1}" th:text="${store.name}"></th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="row : ${pivotList}">
                                    <td th:each="store : ${storeList}" th:if="${store.id != 1}"
                                        th:class="${row.getStockCssClass(store.id)}">
                                        <span class="stock_low_icon"></span>[[${row.getStockByStoreId(store.id)}]]
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    function downloadExcel() {
        // 고정 테이블과 스크롤 테이블 합치기
        const fixedRows = Array.from(document.querySelectorAll(".fixed-table tbody tr"));
        const scrollRows = Array.from(document.querySelectorAll(".scrollable-table tbody tr"));
        const headersLeft = Array.from(document.querySelectorAll(".fixed-table thead th")).map(th => th.innerText.trim());
        const headersRight = Array.from(document.querySelectorAll(".scrollable-table thead th")).map(th => th.innerText.trim());

        const ws_data = [ [...headersLeft, ...headersRight] ];

        for (let i = 0; i < fixedRows.length; i++) {
            const leftTds = Array.from(fixedRows[i].querySelectorAll("td")).map(td => td.innerText.trim());
            const rightTds = Array.from(scrollRows[i].querySelectorAll("td")).map(td => td.innerText.trim());
            ws_data.push([...leftTds, ...rightTds]);
        }

        const wb = XLSX.utils.book_new();
        const ws = XLSX.utils.aoa_to_sheet(ws_data);
        XLSX.utils.book_append_sheet(wb, ws, "재고현황");
        XLSX.writeFile(wb, "매장재고현황.xlsx");
    }
</script>

</body>
</html>
