<body>

<header th:replace="~{/headOffice/tnb}"></header>
<div class="section">
    <div th:replace="~{/headOffice/header}"></div>
    <div class="mainLayout">
        <div class="content">
            <div class="headOfficeMain">
                <div class="contents">


                    <!-- 상단 전체 매출 그래프 -->
                    <div class="sales cont">
                        <div class="cont_top">
                            <h4>전체 매출</h4>
                            <span><a href="/headOffice/salesList" class="moreLink">더보기</a></span>
                        </div>
                        <div class="chart-toggle-btn-wrap btnsWrap">
                            <button id="btnYear" class="chart-toggle-btn" style="font-weight:bold;">금년</button>
                            <button id="btnThisMonth" class="chart-toggle-btn">금월</button>
                            <button id="btnPrevMonth" class="chart-toggle-btn">전월</button>
                        </div>
                        <div class="chart_wrap">
                            <canvas id="salesChart" height="200"></canvas>
                            <div class="chartCaption">
                            </div>
                        </div>
                    </div>

                    <!-- 아래 2x2 그리드 -->
                    <div class="section_02">
                        <div class="receiving cont">
                            <div class="cont_top">
                                <h4>입고현황</h4>
                                <span><a href="/headOffice/inboundList" class="moreLink">더보기</a></span>
                            </div>

                            <div class="notice_wrap">
                                <ul class="franchise_notice">
                                    <li th:each="item : ${recentPurchaseItems}">
                                        <!--                <span th:text="${item.itemCode}"></span>-->
                                        <span th:text="${item.itemName}"></span>
                                        <span th:text="' / ' + ${item.receivedQuantity}"></span>
                                        <span th:text="' | ' + ${item.dueDate}"></span>
                                        <!--                <span th:text="' ~ ' + ${item.expirationDate}"></span>-->
                                        <span th:text="' | ' + ${item.supplier}"></span>
                                        <span th:text="' | ' + ${item.status}"></span>
                                    </li>
                                </ul>
                            </div>
                        </div>


                        <div class="shipping cont">
                            <div class="cont_top">
                                <h4>출고현황</h4>
                                <span><a href="/headOffice/outboundManagement" class="moreLink">더보기</a></span>
                            </div>
                            <div class="notice_wrap">
                                <ul class="franchise_notice">
                                    <li th:each="o : ${recentOutbounds}">
                                        <span th:text="${o.storeName}"></span>
                                        <span th:if="${o.itemName != null}" th:text="' | ' + ${o.itemName}"></span>
                                        <span th:if="${o.receivedQuantity != null}"
                                              th:text="' / ' + ${o.receivedQuantity}"></span>
                                        <span th:if="${o.requiredDate != null}"
                                              th:text="' | ' + ${o.requiredDate}"></span>
                                        <span th:if="${o.dueDate != null}" th:text="' | ' + ${o.dueDate}"></span>
                                        <span th:if="${o.status != null}" th:text="' | ' + ${o.status}"></span>
                                    </li>
                                </ul>
                                <span th:if="${#lists.isEmpty(recentOutbounds)}">출고 현황 없음</span>
                            </div>
                        </div>
                    </div>

                    <div class="section_03">
                        <div class="inventory cont">
                            <div class="cont_top">
                                <h4>부족재고현황</h4>
                                <span><a href="/headOffice/inventoryStore" class="moreLink">더보기</a></span>
                            </div>
                            <div class="notice_wrap">
                                <ul class="stock_notice">
                                    <li th:each="s : ${shortageList}">
                                        <span th:text="${s.itemName}"></span>
                                        <span th:text="' [' + ${s.storeName} + ']'"></span>
                                        <span th:text="' : '"></span>
                                        <span th:text="${s.stock}"
                                              style="color:#fff; background:red; border-radius:4px; padding:2px 7px; font-weight:bold;"></span>
                                    </li>
                                </ul>
                                <span th:if="${#lists.isEmpty(shortageList)}">부족 재고 없음</span>
                            </div>
                        </div>


                        <div class="notice cont">
                            <div class="cont_top">
                                <h4>상담 알림</h4>
                                <span><a href="/headOffice/franchiseList" class="moreLink">더보기</a></span>
                            </div>

                            <div class="notice_wrap">
                                <ul class="franchise_notice">
                                    <th:block th:if="${#lists.isEmpty(alarmList)}">
                                        <li>새로운 상담신청이 없습니다.</li>
                                    </th:block>
                                    <th:block th:each="item : ${alarmList}">
                                        <li>
                                            <a th:href="@{'/headOffice/franchiseDetail/' + ${item.id}}">
                                                [[${item.name}]] ([[${item.tel}]]) - [[${item.space}]]
                                                <br>
                                                <span style="font-size:12px;color:#888;">[[${item.regDate}]]</span>
                                            </a>
                                        </li>
                                    </th:block>
                                </ul>
                            </div>
                        </div>
                    </div>

                </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>
<script th:inline="javascript">
    /*<![CDATA[*/
    let summaryList = /*[[${summaryList}]]*/ [];
    if (!summaryList) summaryList = [];

    // 블루 계열 색상 팔레트
    const blueColors = [
        'rgba(54, 162, 235, 0.8)',
        'rgba(255, 99, 132, 0.8)',
        'rgba(255, 223, 195, 0.8)',
        'rgba(255, 205, 86, 0.8)',
        'rgba(54, 162, 235, 0.8)',
        'rgba(255, 99, 132, 0.8)',
        'rgba(255, 223, 195, 0.8)',
        'rgba(255, 205, 86, 0.8)',
    ];

    // 날짜 유틸
    function getYear(dt) {
        if (!dt) return '';
        return dt.slice(0, 4);
    }

    function getMonth(dt) {
        if (!dt) return '';
        return dt.slice(0, 7); // 'YYYY-MM'
    }

    function getNowYear() {
        return (new Date()).getFullYear().toString();
    }

    function getNowMonth() {
        const now = new Date();
        return now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
    }

    function getPrevMonth() {
        const now = new Date();
        now.setMonth(now.getMonth() - 1);
        return now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
    }

    // summaryList의 날짜필드명 맞춰서 변경 (예: salesDate, dealDate 등)
    const dateField = summaryList.length > 0 && summaryList[0].saleTime ? "saleTime"
        : summaryList.length > 0 && summaryList[0].salesDate ? "salesDate"
            : summaryList.length > 0 && summaryList[0].dealDate ? "dealDate"
                : null;

    // const dateField = "saleTime";

    // === 원본 데이터 저장(필터링에 사용) ===
    const originalSummaryList = summaryList;

    // === 매출 차트 데이터 생성 함수 ===
    function getChartData(filteredList) {
        const storeNames = [...new Set(filteredList.map(r => r.storeName))];
        const menuNames = [...new Set(filteredList.map(r => r.menuName))];

        const datasets = menuNames.map((menu, idx) => ({
            label: menu,
            data: storeNames.map(store => {
                // store, menu별로 전체 매출 합계
                return filteredList
                    .filter(r => r.storeName === store && r.menuName === menu)
                    .reduce((sum, cur) => sum + (cur.totalAmount ? Number(cur.totalAmount) : 0), 0);
            }),
            backgroundColor: blueColors[idx % blueColors.length],
            stack: '매출'
        }));

        return {labels: storeNames, datasets};
    }

    // === 차트 객체 전역 ===
    let salesChart = null;

    // === 차트 그리기 ===
    function drawChart(filteredList) {
        // 지점별 총매출 계산
        const storeTotals = {};
        filteredList.forEach(r => {
            if (!storeTotals[r.storeName]) storeTotals[r.storeName] = 0;
            storeTotals[r.storeName] += Number(r.totalAmount || 0);
        });

        // 매출 총합 기준 상위 5개 지점 추출
        const topStores = Object.entries(storeTotals)
            .sort((a, b) => b[1] - a[1])  // 내림차순 정렬
            .slice(0, 5)                  // 상위 5개만 추출
            .map(entry => entry[0]);     // 지점명만 추출

        // 상위 5개 지점 데이터만 필터링
        const topFilteredList = filteredList.filter(r => topStores.includes(r.storeName));

        const {labels, datasets} = getChartData(topFilteredList);

        const ctx = document.getElementById('salesChart').getContext('2d');
        if (salesChart) salesChart.destroy();
        salesChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: datasets
            },
            options: {
                plugins: {
                    legend: {display: true},
                    tooltip: {
                        callbacks: {
                            label: function (context) {
                                let value = context.raw || 0;
                                return context.dataset.label + ': ' + value.toLocaleString() + '원';
                            }
                        }
                    }
                },
                responsive: true,
                maintainAspectRatio:false,
                layout: {
                    padding: {bottom: 20}
                },
                scales: {
                    x: {
                        stacked: true,
                        ticks: {
                            font: {size: 12},
                            padding: 1
                        }
                    },
                    y: {
                        stacked: true,
                        beginAtZero: true,
                        ticks: {
                            callback: v => v.toLocaleString() + '원'
                        }
                    }
                }
            },
            plugins: [
                {
                    id: 'customTotalLabelBelowTick',
                    afterDraw: (chart) => {
                        const {ctx, chartArea, scales} = chart;
                        ctx.save();
                        ctx.font = 'bold 14px sans-serif';
                        ctx.textAlign = 'center';
                        ctx.fillStyle = '#222';
                        const xAxis = scales.x;
                        chart.data.labels.forEach((store, i) => {
                            let sum = 0;
                            chart.data.datasets.forEach(ds => {
                                sum += ds.data[i] || 0;
                            });
                            const x = xAxis.getPixelForValue(i);
                            const yTick = chartArea.bottom + 38;
                            ctx.fillText(sum.toLocaleString() + '원', x, yTick);
                        });
                        ctx.restore();
                    }
                }
            ]
        });
    }

    console.log(summaryList)
    console.log(filterByYear(originalSummaryList));

    // === 필터 함수 정의 ===
    function filterByYear(list) {
        const year = getNowYear();
        return list.filter(r => !dateField || getYear(r[dateField]) === year);
    }

    function filterByThisMonth(list) {
        const m = getNowMonth();
        return list.filter(r => !dateField || getMonth(r[dateField]) === m);
    }

    function filterByPrevMonth(list) {
        const m = getPrevMonth();
        return list.filter(r => !dateField || getMonth(r[dateField]) === m);
    }

    // === 버튼 클릭 이벤트 ===
    document.addEventListener('DOMContentLoaded', function () {
        // 기본: 금년
        drawChart(filterByYear(originalSummaryList));
        document.getElementById('btnYear').onclick = function () {
            this.style.fontWeight = 'bold';
            document.getElementById('btnThisMonth').style.fontWeight = 'normal';
            document.getElementById('btnPrevMonth').style.fontWeight = 'normal';
            drawChart(filterByYear(originalSummaryList));
        };
        document.getElementById('btnThisMonth').onclick = function () {
            this.style.fontWeight = 'bold';
            document.getElementById('btnYear').style.fontWeight = 'normal';
            document.getElementById('btnPrevMonth').style.fontWeight = 'normal';
            drawChart(filterByThisMonth(originalSummaryList));
        };
        document.getElementById('btnPrevMonth').onclick = function () {
            this.style.fontWeight = 'bold';
            document.getElementById('btnYear').style.fontWeight = 'normal';
            document.getElementById('btnThisMonth').style.fontWeight = 'normal';
            drawChart(filterByPrevMonth(originalSummaryList));
        };
    });
    /*]]>*/
</script>
</body>
