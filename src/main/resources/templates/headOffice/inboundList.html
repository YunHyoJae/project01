<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>본사 입고관리 - 입고현황</title>
  <style>
    body {font-family: 'Malgun Gothic', sans-serif; background: #f9f9f9;}
    .container {width: 1000px; margin: 40px auto; background: #fff; padding: 32px; border-radius: 10px; box-shadow: 0 2px 8px #eee;}
    h2 {margin-bottom: 18px;}
    .tabs {display: flex; gap: 8px; margin-bottom: 20px;}
    .tab-btn {padding: 8px 18px; border: none; background: #f3f3f3; border-radius: 5px 5px 0 0; cursor: pointer; font-weight: bold;}
    .tab-btn.active {background: #ff9900; color: #fff;}
    table {width: 100%; border-collapse: collapse; margin-bottom: 16px;}
    th, td {border: 1px solid #e0e0e0; padding: 8px 10px; text-align: center;}
    th {background: #faf7f2;}
  </style>
  <script th:inline="javascript">
    function setTab(status) {
      const url = new URL(window.location.href);
      url.searchParams.set('status', status);
      window.location.href = url.toString();
    }
    document.addEventListener("DOMContentLoaded", function() {
      const params = new URL(window.location.href).searchParams;
      const status = params.get("status") || "ALL";
      document.querySelectorAll('.tab-btn').forEach(btn => {
        if (btn.dataset.status === status) btn.classList.add("active");
        else btn.classList.remove("active");
      });
      document.querySelectorAll('.tab-table').forEach(table => {
        // status=ALL이면 모든 테이블, 아니면 해당 테이블만
        if (status === "ALL" || table.dataset.status === status) table.style.display = "";
        else table.style.display = "none";
      });
    });
  </script>
</head>
<body>
<div class="container">
  <h2>본사입고관리 - 입고현황</h2>
  <div class="tabs">
    <button type="button" class="tab-btn" data-status="ALL" onclick="setTab('ALL')">주문전체</button>
    <button type="button" class="tab-btn" data-status="ING" onclick="setTab('ING')">진행중</button>
    <button type="button" class="tab-btn" data-status="ORDER" onclick="setTab('ORDER')">발주조회</button>
    <button type="button" class="tab-btn" data-status="RETURN" onclick="setTab('RETURN')">매장반품조회</button>
  </div>

  <!-- 발주현황 테이블 (발주조회/주문전체에서만 보임) -->
  <table class="tab-table" data-status="ORDER">
    <thead>
    <tr>
      <th>번호</th>
      <th>발주번호</th>
      <th>발주일자</th>
      <th>발주유형</th>
      <th>상세</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="purchase, stat : ${purchaseList}">
      <td th:text="${stat.index + 1}">1</td>
      <td th:text="${purchase.purchaseNumber}">PO20250613-XXXX</td>
      <td th:text="${#temporals.format(purchase.orderedDate, 'yyyy-MM-dd HH:mm')}">2025-06-13 12:34</td>
      <td th:text="${purchase.typeOrder}">발주</td>
      <td>
        <a th:href="@{/headOffice/inboundDetail(purchaseNumber=${purchase.purchaseNumber})}">상세보기</a>
      </td>
    </tr>
    <tr th:if="${purchaseList == null or #lists.isEmpty(purchaseList)}">
      <td colspan="5">조회된 주문 내역이 없습니다.</td>
    </tr>
    </tbody>
  </table>

  <!-- 반품현황 테이블 (매장반품조회/주문전체에서만 보임) -->
  <table class="tab-table" data-status="RETURN">
    <thead>
    <tr>
      <th>반품번호</th>
      <th>반품일자</th>
      <th>반품유형</th>
      <th>반품사유</th>
      <th>품목코드</th>
      <th>품목명</th>
      <th>반품수량</th>
      <th>상태</th>
    </tr>
    </thead>
    <tbody>
    <th:block th:each="returnDto : ${returnList}">
      <tr th:each="returnDto : ${returnList}" th:if="${returnDto.items != null and !#lists.isEmpty(returnDto.items)}">
        <td th:rowspan="${#lists.size(returnDto.items)}" th:text="${returnDto.returnNumber}"></td>
        <td th:rowspan="${#lists.size(returnDto.items)}" th:text="${#temporals.format(returnDto.requiredDate, 'yyyy-MM-dd HH:mm')}"></td>
        <td th:rowspan="${#lists.size(returnDto.items)}" th:text="${returnDto.typeReturn}"></td>
        <td th:rowspan="${#lists.size(returnDto.items)}" th:text="${returnDto.returnNote}"></td>
        <td th:text="${returnDto.items[0].itemCode}"></td>
        <td th:text="${returnDto.items[0].itemName}"></td>
        <td th:text="${returnDto.items[0].returnQuantity}"></td>
        <td th:text="${returnDto.items[0].status}"></td>
      </tr>
      <tr th:each="item,iterStat : ${returnDto.items}" th:if="${iterStat.index > 0}">
        <td th:text="${item.itemCode}"></td>
        <td th:text="${item.itemName}"></td>
        <td th:text="${item.returnQuantity}"></td>
        <td th:text="${item.status}"></td>
      </tr>
    </th:block>
    <tr th:if="${returnList == null or #lists.isEmpty(returnList)}">
      <td colspan="8">조회된 반품 내역이 없습니다.</td>
    </tr>
    </tbody>
  </table>
</div>
</body>
</html>
