<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{/headOffice/meta::myHead('출고관리')}"></head>
<header th:replace="~{/headOffice/tnb}"></header>
<div class="section">
    <div th:replace="~{/headOffice/header}"></div>
    <div class="main-layout">
        <div th:replace="~{/headOffice/etcLnb::active('shipping','outboundManagement')}"></div>

        <div class="shippingForm content">
            <h2>출고관리</h2>
            <div class="container">
                <form method="get" th:action="@{/headOffice/outboundManagement}" class="filter-section">
                    <div class="date-filter">
                        <label>요청 일자</label>
                        <input type="date" name="startDate" th:value="${startDate}" id="startDate"> -
                        <input type="date" name="endDate" th:value="${endDate}" id="endDate">
                    </div>

                    <div class="store-filter">
                        <label>매장명</label>
                        <input type="text" name="storeName" th:value="${storeName}" placeholder="매장명" />
                        <button type="submit" class="search-btn default_btn">검색</button>
                        <button type="button" class="complete-btn default_btn" onclick="sendUpdate('출고완료')">출고완료</button>
                        <button type="button" class="approve-btn default_btn" onclick="sendUpdate('승인')">승인</button>
                    </div>
                </form>

                <table class="shipment-table">
                    <thead>
                    <tr>
                        <th><input type="checkbox" id="checkAll" onclick="toggleAll(this)"></th>
                        <th>매장명</th>
                        <th>요청일</th>
                        <th>품목코드</th>
                        <th>품목명 / 수량</th>
                        <th>출고일</th>
                        <th>출고상태</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="row : ${outbounds}">
                        <td>
                            <input type="checkbox" class="row-check" name="selectRow"
                                   th:value="${row.outBoundId}"
                                   th:disabled="${row.status == '출고완료'}"/>
                        </td>
                        <td th:text="${row.storeName}"></td>
                        <td th:text="${row.requiredDate}"></td>
                        <td th:text="${row.itemCode}"></td>
                        <td th:text="${row.itemName + ' / ' + row.receivedQuantity}"></td>
                        <td th:text="${row.dueDate}"></td>
                        <td th:text="${row.status}"></td>
                    </tr>
                    </tbody>
                </table>

                <div class="pagination" th:if="${totalPages > 0}">
                    <a th:href="@{/headOffice/outboundManagement(page=${currentPage - 1}, startDate=${startDate}, endDate=${endDate}, storeName=${storeName})}"
                       th:if="${currentPage > 1}">&lt;</a>

                    <a th:each="i : ${#numbers.sequence(1, totalPages)}"
                       th:href="@{/headOffice/outboundManagement(page=${i}, startDate=${startDate}, endDate=${endDate}, storeName=${storeName})}"
                       th:text="${i}"
                       th:classappend="${i == currentPage} ? 'active' : ''"></a>

                    <a th:href="@{/headOffice/outboundManagement(page=${currentPage + 1}, startDate=${startDate}, endDate=${endDate}, storeName=${storeName})}"
                       th:if="${currentPage < totalPages}">&gt;</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function toggleAll(source) {
        document.querySelectorAll('.row-check:not(:disabled)').forEach(cb => cb.checked = source.checked);
    }

    function sendUpdate(status) {
        const checked = [...document.querySelectorAll('.row-check:checked')].map(cb => parseInt(cb.value));
        if (checked.length === 0) {
            alert("선택된 출고건이 없습니다.");
            return;
        }

        fetch('/headOffice/outboundManagement', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ outBoundIds: checked, status: status })
        })
            .then(response => response.text())
            .then(msg => {
                alert(msg);
                location.reload();
            })
            .catch(err => {
                alert("요청 실패");
                console.error(err);
            });
    }
</script>
</html>
