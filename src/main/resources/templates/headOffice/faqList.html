<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{/headOffice/meta::myHead('점주질문')}"></head>
<body>
<header th:replace="~{/headOffice/tnb}"></header>
<div class="section">
    <div th:replace="~{/headOffice/header}"></div>


    <div class="main-layout">
        <div th:replace="~{/headOffice/etcLnb::active('etc','faq')}"></div>

        <!-- 본문 컨텐츠 -->
        <div class="content storeStatus" style="padding-bottom:100px;">
            <h2>점주 질문</h2>
            <div class="search_box typePark">
                <form action="/headOffice/faqList"
                  method="get" class="search_form" id="searchForm">
                    <input type="hidden" name="keyword" id="keywordBox">
                    <select name="category" class="searchTerm" onchange="changeForm2(this)">
                        <option value="member" th:selected="${pageDto.category == 'member'}">작성자</option>
                        <option value="title" th:selected="${pageDto.category == 'title'}">제목</option>
                        <option value="category" th:selected="${pageDto.category == 'category'}">유형</option>
                    </select>
                    <input type="text" th:value="${pageDto.category != 'category' ? pageDto.keyword : ''}" class="textBox" placeholder="검색어를 입력하시오." id="query"/>
                    <select class="statusBox" id="statusBox" style="display:none">
                        <option value="홈페이지" th:selected="${pageDto.category == 'category' and pageDto.keyword == '홈페이지'}">홈페이지</option>
                        <option value="매출" th:selected="${pageDto.category == 'category' and pageDto.keyword == '매출'}">매출문의</option>
                        <option value="재고" th:selected="${pageDto.category == 'category' and pageDto.keyword == '재고'}">재고문의</option>
                        <option value="주문" th:selected="${pageDto.category == 'category' and pageDto.keyword == '주문'}">주문문의</option>
                        <option value="반품" th:selected="${pageDto.category == 'category' and pageDto.keyword == '반품'}">반품문의</option>
                    </select>
                    <button type="button" onclick="submitForm()" class="search_btn"/>검색</button>
                </form>
            </div>
            <div class="storeStatus-box box">
                <table>
                    <thead>
                    <tr>
                        <th>번호</th>
                        <th>유형</th>
                        <th>제목</th>
                        <th>작성자</th>
                        <th>날짜</th>
                        <th>상태</th>
                    </tr>
                    </thead>
                    <tbody>
                    <th:block th:each="item:${list}">
                        <tr th:onclick="'handleClick(\''+${item.id}+'\')'">
                            <td>[[${itemStat.count}]]</td><td>[[${item.category01}]]</td>
                            <td>[[${item.title}]] <img src="/images/secureswitch.gif" alt="secure_switch" class="vault-locked" th:if="${#strings.equals(item.state,'비공개')}"></td>
                            <td>[[${item.memberName}]]</td><td>[[${item.regDate}]]</td><td th:text="${#lists.isEmpty(item.faqReplyList) ? '문의' : '답변완료'}"></td>
                        </tr>
                    </th:block>
                    </tbody>
                </table>
            </div>
            
            <!-- 페이징 -->
            <div th:replace="/headOffice/pagination :: pagination(${pageDto})"></div>
        </div>
    </div>
</div>
<script defer>
    function handleClick(id) {
        window.location.href = `/headOffice/faqDetail/${id}`;
    }
    const searchFormTextBox = document.getElementById("query");
    function changeForm2(selectElement) {
        const form = selectElement.closest("form");
        const viewSelect = form.querySelector(".statusBox");
        let selectValue = selectElement.value;

        if(selectValue === "category") {
            searchFormTextBox.style.display = "none";
            viewSelect.style.display = "block";
        }  else {
            viewSelect.style.display = "none";
            searchFormTextBox.style.display = "block";
        }
    }
    function submitForm() {
        const form = document.getElementById("searchForm");
        const category = form.querySelector("select[name='category']").value;
        const keywordBox = document.getElementById("keywordBox");
        if(category==="category"){
            keywordBox.value=document.getElementById("statusBox").value;
        }else{
            keywordBox.value=searchFormTextBox.value;
        }
        form.submit();
    }
    searchFormTextBox.addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
            event.preventDefault();
            submitForm();
        }
    });
</script>
</body>
</html>
