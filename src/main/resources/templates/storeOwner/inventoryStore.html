<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{/storeOwner/meta::myHead('매장 재고현황')}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>매장 재고현황</title>
    <link rel="stylesheet" href="/css/storeOwner.css">
</head>
<style>
    .stock_low_icon{display:none;}
    .low-stock .stock_low_icon{
        display: inline-block;
        width: 1em;
        height: 1em;
        background: #f6bb7c;
        margin-right: 10px;
        border-radius: 0.5em;margin-bottom:-2px;
    }
    .main-layout{
        background-color: #fff;
    }

</style>
<body>
<header th:replace="~{/storeOwner/tnb}"></header>

<div class="section">
    <div th:replace="~{/storeOwner/header}"></div>

    <div class="main-layout">
        <div th:replace="storeOwner/etcLnb :: active('inventory', 'inventoryStore')"></div>

        <div class="content">
        <div class="salesInventory">
            <h2 th:text="'[' + ${store.name} + '] 매장 재고현황'"></h2>

            <div class="search-bar">
                <form th:action="@{/storeOwner/inventoryStore}" method="get" oninput="updateSearchTarget()">
                    <label>
                        <select id="searchType" name="searchType" onchange="updateSearchTarget()">
                            <option value="itemName" th:selected="${searchType == 'itemName'}">품목명</option>
                            <option value="itemCode" th:selected="${searchType == 'itemCode'}">품목코드</option>
                        </select>
                    </label>

                    <input type="text" id="searchInput" name="itemName" th:value="${itemName}" placeholder="검색어 입력">

                    <button type="submit">검색</button>
                </form>
            </div>

            <script>
                function updateSearchTarget() {
                    const type = document.getElementById("searchType").value;
                    const input = document.getElementById("searchInput");
                    if (type === 'itemName') {
                        input.name = 'itemName';
                    } else {
                        input.name = 'itemCode';
                    }
                }

                document.addEventListener("DOMContentLoaded", updateSearchTarget);
            </script>

            <script>
                function orderSelected() {
                    const checked = document.querySelectorAll('.order-checkbox:checked');
                    if (checked.length === 0) {
                        alert('주문할 품목을 선택하세요!');
                        return;
                    }
                    const params = [];
                    checked.forEach(cb => {
                        params.push('itemCode=' + encodeURIComponent(cb.dataset.itemCode));
                        params.push('needed=' + encodeURIComponent(cb.dataset.needed));
                    });
                    window.location.href = '/storeOwner/storeorderForm?' + params.join('&');
                }
            </script>

            <form id="orderForm">
                <table class="stock-table">
                    <thead>
                    <tr>
                        <th></th> <!-- 체크박스용 -->
                        <th>품목코드</th>
                        <th>품목명</th>
                        <th th:text="${store.name}">매장명</th>
                        <th>한달필요재고</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="row : ${pivotList}">
                        <td>
                            <input type="checkbox"
                                   class="order-checkbox"
                                   th:attr="data-item-code=${row.itemCode},
                data-needed=${(row.getNeededRoundedByStoreId(store.id) - row.getStockByStoreId(store.id)) > 0
                              ? (row.getNeededRoundedByStoreId(store.id) - row.getStockByStoreId(store.id))
                              : 0}">
                        </td>
                        <td th:text="${row.itemCode}">품목코드</td>
                        <td th:text="${row.itemName}">품목명</td>
                        <td th:class="'stock-cell ' + ${row.getStockCssClass(store.id)}"
                            th:attr="data-item-code=${row.itemCode},
               data-needed=${(row.getNeededRoundedByStoreId(store.id) - row.getStockByStoreId(store.id)) > 0
                             ? (row.getNeededRoundedByStoreId(store.id) - row.getStockByStoreId(store.id))
                             : 0}"><span class="stock_low_icon"></span>[[${row.getStockByStoreId(store.id)}]]
                        </td>
                        <td th:text="${row.getNeededRoundedByStoreId(store.id)}">필요재고</td>
                    </tr>
                    </tbody>
                </table>
                <button type="button" style="margin-top: 30px;" onclick="orderSelected()">주문</button>
            </form>
        </div>
        </div>
    </div>
</div>
</body>
</html>
