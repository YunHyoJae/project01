<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>주문 신청</title>
    <script>
        async function openItemPopup(index) {
            window.open(`/storeOwner/storeOrderPopup?index=${index}`, 'popup', 'width=500,height=400');
        }

        function selectItemFromPopup(index, code, name, price, stock) {
            const duplicates = Array.from(document.getElementsByName("itemCode")).some(
                (input, i) => i !== index && input.value === code
            );
            if (duplicates) {
                alert("이미 선택된 품목입니다.");
                return;
            }

            document.getElementById(`itemCode-${index}`).value = code;
            document.getElementById(`itemName-${index}`).innerText = name;
            document.getElementById(`price-${index}`).innerText = price;
            document.getElementById(`stock-${index}`).innerText = stock;
            updateTotal(index);
            window.close();
        }

        function addRow() {
            const table = document.getElementById("order-items");
            const index = table.rows.length;
            const row = table.insertRow();

            row.innerHTML = `
            <td><span class="orderNumberCell" id="orderNumber-${index}">${document.getElementById("orderNumber").textContent}</span></td>
            <td>
              <input type="text" id="itemCode-${index}" name="itemCode"
                     onblur="onItemCodeInput(${index})">
              <button type="button" onclick="openItemPopup(${index})">검색</button>
            </td>
            <td><span id="itemName-${index}"></span></td>
            <td><input type="number" name="orderedQuantity" min="0" value="0" oninput="updateTotal(${index})"></td>
            <td><span id="stock-${index}"></span></td>
            <td><span id="price-${index}">0</span></td>
            `;
        }

        function updateTotal() {
            let total = 0;
            const itemCodes = document.getElementsByName("itemCode");
            const quantities = document.getElementsByName("orderedQuantity");

            for (let i = 0; i < itemCodes.length; i++) {
                const price = parseInt(document.getElementById(`price-${i}`).innerText) || 0;
                const qty = parseInt(quantities[i].value) || 0;
                total += price * qty;
            }

            document.getElementById("totalAmount").innerText = total;
        }

        async function submitOrder() {
            const itemCodes = document.getElementsByName("itemCode");
            const quantities = document.getElementsByName("orderedQuantity");

            const items = [];

            for (let i = 0; i < itemCodes.length; i++) {
                const code = itemCodes[i].value.trim();
                const qty = parseInt(quantities[i].value.trim());

                if (code && qty > 0) {
                    items.push({ itemCode: code, orderedQuantity: qty });
                }
            }

            if (items.length === 0) {
                alert("품목을 선택하고 수량을 입력하세요.");
                return;
            }

            const payload = {
                items: items
            };

            const response = await fetch('/storeOwner/storeOrder', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                alert("주문 완료!");
                location.href = '/storeOwner/storeOrderList';
            } else {
                alert("재고 부족: 주문수량이 재고보다 많습니다. " + response.statusText);
            }
        }

        async function fetchItemInfo(itemCode) {
            if (!itemCode) return null;
            // 아래 경로를 컨트롤러와 맞춰주세요!
            const res = await fetch('/storeOwner/storeOrder/itemInfo?itemCode=' + encodeURIComponent(itemCode));
            if (!res.ok) return null;
            return await res.json();
        }
        async function onItemCodeInput(index) {
            const code = document.getElementById(`itemCode-${index}`).value.trim();
            if (!code) return;
            const data = await fetchItemInfo(code);
            if (data) {
                document.getElementById(`itemName-${index}`).innerText = data.itemName || '-';
                document.getElementById(`price-${index}`).innerText = data.itemPrice || 0;
                updateTotal(index);
            } else {
                document.getElementById(`itemName-${index}`).innerText = '-';
                document.getElementById(`price-${index}`).innerText = 0;
                updateTotal(index);
            }
        }

        function getQueryParams(name) {
            const params = new URLSearchParams(window.location.search);
            const values = [];
            for (const [key, value] of params.entries()) {
                if (key === name) values.push(value);
            }
            return values;
        }

        window.onload = () => {
            const itemCodes = getQueryParams("itemCode");
            const neededQtys = getQueryParams("needed");
            const rowCount = Math.max(itemCodes.length, neededQtys.length, 3);
            for (let i = 0; i < rowCount; i++) addRow();

            for (let i = 0; i < itemCodes.length; i++) {
                if (itemCodes[i]) {
                    document.getElementById(`itemCode-${i}`).value = itemCodes[i];
                    onItemCodeInput(i); // AJAX로 품목명/단가 자동채움
                }
                if (neededQtys[i]) document.getElementsByName("orderedQuantity")[i].value = neededQtys[i];
            }
        };
        //
        // window.onload = () => {
        //     for (let i = 0; i < 3; i++) addRow();
        // }
    </script>
</head>
<body>
<h2>주문 신청</h2>
<h3>주문번호: <span id="orderNumber" th:text="${orderNumber}">ORD-XXXX</span></h3>
<table border="1">
    <thead>
    <tr>
        <th>주문번호</th>
        <th>품목코드</th>
        <th>품목명</th>
        <th>수량</th>
        <th>재고</th>
        <th>단가(₩)</th>
    </tr>
    </thead>
    <tbody id="order-items"></tbody>
</table>
<p><strong>총 금액:</strong> <span id="totalAmount">0</span>원</p>
<button type="button" onclick="addRow()">행 추가</button>
<button type="button" onclick="submitOrder()">주문</button>
</body>
</html>
