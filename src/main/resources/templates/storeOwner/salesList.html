<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8">
  <title>점주 매출 조회</title>
</head>
<body>

<script th:if="${param.alert}" th:inline="javascript">
  alert([[${param.alert}]]);
</script>

<h2>📊 매출 목록</h2>

<!-- 조회 조건 -->
<form th:action="@{/storeOwner/salesList}" method="get">
  <div>
    <label>시작일:
      <input type="date" name="startDate" th:value="${#dates.format(startDate, 'yyyy-MM-dd')}">
    </label>
  </div>

  <div>
    <label>종료일:
      <input type="date" name="endDate" th:value="${#dates.format(endDate, 'yyyy-MM-dd')}">
    </label>
  </div>
  <div>
    <button type="submit">조회</button>
  </div>
</form>

<br/>

<!-- 매출 현황 -->
<table border="1">
  <thead>
  <tr>
    <th>매장 ID</th>
    <th>매장명</th>
    <th>메뉴 ID</th>
    <th>메뉴명</th>
    <th>총 판매수량</th>
    <th>매출액</th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="summary : ${summaryList}">
    <td th:text="${summary.storeId}"></td>
    <td th:text="${summary.storeName}"></td>
    <td th:text="${summary.menuId}"></td>
    <td th:text="${summary.menuName}"></td>
    <td th:text="${summary.totalQuantity}"></td>
    <td th:text="${#numbers.formatInteger(summary.totalAmount, 3, 'COMMA')}"></td>
  </tr>
  </tbody>
  <tbody>
  <tr>
    <td>합계</td>
    <td></td>
    <td></td>
    <td></td>
    <td th:text="${totalQuantity}"></td>
    <td th:text="${#numbers.formatInteger(totalAmount, 0, 'COMMA')}"></td>
  </tr>
  </tbody>
</table>

<br/>

<!-- 🧾 판매 입력 -->
<h3>📝 판매 입력</h3>
<form th:action="@{/storeOwner/salesInput}" method="post">
  <!-- storeId는 점주 로그인 기반으로 자동 설정 -->
  <input type="hidden" name="storeId" th:value="${storeId}">

  <div>
    <label>판매 시간:
      <input type="datetime-local" name="saleTime" required>
    </label>
  </div>

  <div>
    <label>메뉴:
      <select name="menuId" required>
        <option th:each="menu : ${menuList}"
                th:value="${menu.menuId}"
                th:text="${menu.menuName + ' (' + menu.menuId + ') - ' + #numbers.formatInteger(menu.menuPrice, 3, 'COMMA') + '원'}">
        </option>
      </select>
    </label>
  </div>

  <div>
    <label>수량:
      <input type="number" name="quantity" min="1" required>
    </label>
  </div>

  <div>
    <button type="submit">등록</button>
  </div>
</form>

</body>
</html>
