
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!-- 왼쪽 사이드바 -->
<div class="sidebar" th:fragment="nonActive"></div>
<div class="sidebar" th:fragment="active(title,sub)">
  <ul>
    <li class="order">
      <a href="#">주문</a>
      <ul class="submenu">
        <li><a href="#">주문신청</a></li>
        <li><a href="#">주문현황</a></li>
      </ul>
    </li>
    <li class="return">
      <a href="#">반품</a>
      <ul class="submenu">
        <li><a href="#">반품신청</a></li>
        <li><a href="#">반품현황</a></li>
      </ul>
    </li>
    <li class="sales">
      <a href="#">매출</a>
      <ul class="submenu">
        <li><a href="#">매출분석</a></li>
      </ul>
    </li>
    <li class="stock">
      <a href="#">재고</a>
      <ul class="submenu">
        <li><a href="#">매장재고</a></li>
        <li><a href="#">판매현황</a></li>
      </ul>
    </li>
    <li class="etc" style="display:block" th:if="${#strings.equals(title,'etc')}">
      <a href="/storeOwner/faqList">고객센터</a>
      <ul class="submenu">
        <li><a href="/storeOwner/faqList" th:classappend="${#strings.equals(sub, 'list') ? 'on' : ''}">문의 게시판</a></li>
        <li><a href="/storeOwner/faqEdit" th:classappend="${#strings.equals(sub, 'edit') ? 'on' : ''}">문의하기</a></li>
        <li><a href="/storeOwner/faqList/owner" th:classappend="${#strings.equals(sub, 'owner') ? 'on' : ''}">내 문의글</a></li>
      </ul>
    </li>
  </ul>
</div>
</html>
