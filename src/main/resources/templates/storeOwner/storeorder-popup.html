<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>품목 선택</title>
</head>
<body>
<h3>품목 선택</h3>
<table border="1">
  <thead>
  <tr>
    <th>코드</th>
    <th>이름</th>
    <th>단가</th>
    <th>선택</th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="item : ${items}">
    <td th:text="${item.itemCode}"></td>
    <td th:text="${item.itemName}"></td>
    <td th:text="${item.itemPrice}"></td>
    <td>
      <button type="button"
              th:onclick="'selectItem(' +
                    '\'' + ${item.itemCode} + '\',' +
                    '\'' + ${item.itemName} + '\',' +
                    ${item.itemPrice} + ')'"
      >선택</button>
    </td>
  </tr>
  </tbody>
</table>

<script>
  function selectItem(code, name, price) {
    const rows = window.opener.document.querySelectorAll("tr.item-row");
    for (const row of rows) {
      const codeInput = row.querySelector("input[name='itemCode']");
      if (codeInput && !codeInput.value) {
        codeInput.value = code;
        row.querySelector("input[name='itemName']").value = name;
        row.querySelector("input[name='itemPrice']").value = price;
        window.opener.updateRowTotal(row); // 총액 계산 함수 호출
        window.close();
        return;
      }
    }
    alert("모든 행이 이미 채워져 있습니다.");
  }
</script>
</body>
</html>
