<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{storeOwner/meta::myHead('주문신청')}"></head>
<header th:replace="~{storeOwner/tnb}"></header>

<div class="section">
    <div th:replace="~{storeOwner/header}"></div>
    <div class="main-layout">
        <div th:replace="~{storeOwner/etcLnb::active('order','storeorderForm')}"></div>

        <div class="content">
            <div class="orderForm">
                <h2 class="title">주문신청</h2>
                <h3>주문번호: <span id="orderNumber" th:text="${orderNumber}">ORD-XXXX</span></h3>
                <button class="addRow_btn" onclick="addRow()">행 추가 ➕</button>
                <div class="orderForm-box box">
                    <table id="orderFormTable">
                        <thead>
                        <tr>
                            <th><input type="checkbox" onclick="selectAll(this)" /></th>
                            <th>주문번호</th>
                            <th>품목코드</th>
                            <th>품목명</th>
                            <th></th>
                            <th>수량</th>
                            <th>재고</th>
                            <th>단가</th>
                            <th></th>
                        </tr>
                        </thead>
                        <tbody id="order-items"></tbody>
                        <tfoot>
                        <tr>
                            <th colspan="4">총 금액</th>
                            <td colspan="5"><span id="totalAmount">0</span>원</td>
                        </tr>
                        </tfoot>
                    </table>
                    <button class="default_btn apply_btn" onclick="submitOrder()">신청</button>
                </div>

                <!-- 모달창 -->
                <div id="modalBg">
                    <div class="modal" style="max-height: 80vh; overflow-y: auto;">
                        <h2 class="modal_tit">품목 검색</h2>
                        <form class="search-box" onsubmit="return false;">
                            <div class="search_row">
                                <label>품목명검색</label>
                                <label>품목코드검색</label>
                            </div>
                            <div class="search_row">
                                <input id="searchName" type="text" placeholder="품목명검색" oninput="debouncedSearch()" />
                                <input id="searchCode" type="text" placeholder="품목코드검색" oninput="debouncedSearch()" />
                            </div>
                        </form>

                        <table class="result-table">
                            <thead>
                            <tr>
                                <th>품목코드</th>
                                <th>품목명</th>
                                <th>단가</th>
                                <th>선택</th>
                            </tr>
                            </thead>
                            <tbody id="modalResultBody">
                            <tr><td colspan="4">검색 결과 없음</td></tr>
                            </tbody>
                        </table>

                        <div style="text-align: center; margin: 10px 0;" id="paginationArea" class="pagination"></div>

                        <div class="modal-footer">
                            <label class="close-btn" onclick="hideModal()">닫기</label>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let currentPage = 0;
    let debounceTimer;

    function debounce(func, delay = 300) {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(func, delay);
    }

    function debouncedSearch() {
        debounce(() => loadItems(0));
    }

    // function addRow() {
    //     const table = document.getElementById("order-items");
    //     const index = table.rows.length;
    //     const orderNumber = document.getElementById("orderNumber")?.textContent || "";

    //     const row = table.insertRow();
    //     row.innerHTML = `
    //   <td><input type="checkbox"/></td>
    //   <td><input type="text" class="order_no" value="${orderNumber}" readonly></td>
    //   <td><input type="text" class="pd_code" id="itemCode-${index}" onblur="onItemCodeInput(${index})" name="itemCode"></td>
    //   <td><input type="text" class="pd_name" id="itemName-${index}" readonly></td>
    //   <td class="search_td"><button class="default_btn" onclick="openItemModal(${index})">검색</button></td>
    //   <td><input type="number" name="orderedQuantity" value="0" min="0" oninput="updateTotal()"></td>
    //   <td><input type="text" id="stock-${index}" value="" readonly></td>
    //   <td><input type="text" id="price-${index}" value="0" readonly></td>
    //   <td><button onclick="deleteRow(this)" class="del_rowBtn">❌</button></td>
    // `;

    //강동현 추가
    function addRow(itemCode = "", needed = "") {
        const table = document.getElementById("order-items");
        const index = table.rows.length;
        const orderNumber = document.getElementById("orderNumber")?.textContent || "";

        table.insertRow().innerHTML = `
      <td><input type="checkbox"/></td>
      <td><input type="text" class="order_no" value="${orderNumber}" readonly></td>
      <td><input type="text" class="pd_code" id="itemCode-${index}" onblur="onItemCodeInput(${index})" name="itemCode" value="${itemCode}"></td>
      <td><input type="text" class="pd_name" id="itemName-${index}" readonly></td>
      <td class="search_td"><button class="default_btn" onclick="openItemModal(${index})">검색</button></td>
      <td><input type="number" name="orderedQuantity" value="${needed}" min="0" oninput="updateTotal()"></td>
      <td><input type="text" id="stock-${index}" value="" readonly></td>
      <td><input type="text" id="price-${index}" value="0" readonly></td>
      <td><button onclick="deleteRow(this)" class="del_rowBtn">❌</button></td>
    `;

        // itemCode가 설정된 후, 강제로 onItemCodeInput 호출
        if (itemCode) {
            onItemCodeInput(index);
        }
        //강동현 추가

    }

    function updateTotal() {
        let total = 0;
        const itemCodes = document.getElementsByName("itemCode");
        const quantities = document.getElementsByName("orderedQuantity");
        for (let i = 0; i < itemCodes.length; i++) {
            const price = parseInt(document.getElementById(`price-${i}`)?.value || 0);
            const qty = parseInt(quantities[i]?.value || 0);
            total += price * qty;
        }
        document.getElementById("totalAmount").innerText = total.toLocaleString();
    }

    function deleteRow(button) {
        const row = button.closest("tr");
        row.remove();
        updateTotal();
    }

    async function openItemModal(index) {
        window.selectedRowIndex = index;
        currentPage = 0;
        await loadItems(currentPage);
        document.getElementById("modalBg").style.display = "block";
    }

    function hideModal() {
        document.getElementById("modalBg").style.display = "none";
    }

    async function loadItems(page) {
        const name = document.getElementById("searchName").value.trim();
        const code = document.getElementById("searchCode").value.trim();
        const res = await fetch(`/storeOwner/storeOrderItems?page=${page}&name=${name}&code=${code}`);
        const json = await res.json();

        const items = json.content;
        const totalPages = json.totalPages;

        const tbody = document.getElementById("modalResultBody");
        tbody.innerHTML = "";

        if (items.length === 0) {
            tbody.innerHTML = "<tr><td colspan='4'>검색 결과 없음</td></tr>";
        } else {
            items.forEach(item => {
                const tr = document.createElement("tr");
                tr.innerHTML = `
          <td>${item.itemCode}</td>
          <td>${item.itemName}</td>
          <td>${item.itemPrice}</td>
          <td><button onclick="selectItemFromModal('${item.itemCode}', '${item.itemName}', ${item.itemPrice}, ${item.stockQuantity})">선택</button></td>
        `;
                tbody.appendChild(tr);
            });
        }

        const pagination = document.getElementById("paginationArea");
        pagination.innerHTML = "";
        for (let i = 0; i < totalPages; i++) {
            const btn = document.createElement("span");
            btn.innerText = i + 1;
            btn.style.margin = "0 5px";
            if (i === page) btn.style.fontWeight = "bold";
            btn.onclick = () => {
                currentPage = i;
                loadItems(i);
            };
            pagination.appendChild(btn);
        }
    }

    function selectItemFromModal(code, name, price, stock) {
        const index = window.selectedRowIndex;
        const duplicates = Array.from(document.getElementsByName("itemCode")).some((input, i) => i !== index && input.value === code);
        if (duplicates) return alert("이미 선택된 품목입니다.");

        document.getElementById(`itemCode-${index}`).value = code;
        document.getElementById(`itemName-${index}`).value = name;
        document.getElementById(`price-${index}`).value = price;
        document.getElementById(`stock-${index}`).value = stock;
        updateTotal();
        hideModal();
    }

    // async function onItemCodeInput(index) {
    //     const code = document.getElementById(`itemCode-${index}`).value.trim();
    //     if (!code) return;
    //     const res = await fetch('/storeOwner/storeOrder/itemInfo?itemCode=' + encodeURIComponent(code));
    //     if (!res.ok) return;
    //     const data = await res.json();
    //     document.getElementById(`itemName-${index}`).value = data.itemName || '-';
    //     document.getElementById(`price-${index}`).value = data.itemPrice || 0;
    //     document.getElementById(`stock-${index}`).value = data.stockQuantity ?? "-";
    //     updateTotal();
    // }

    //강동현 추가부분
    async function onItemCodeInput(index) {
        const code = document.getElementById(`itemCode-${index}`).value.trim();
        if (!code) return;

        console.log(`Fetching item info for itemCode: ${code}`);

        try {
            const res = await fetch(`/storeOwner/storeOrder/itemInfo?itemCode=${encodeURIComponent(code)}`);
            if (!res.ok) {
                console.error(`Failed to fetch item info for ${code}. Status: ${res.status}`);
                return;
            }

            const data = await res.json();
            console.log(`Item info received:`, data);

            // 데이터가 정상적으로 받아졌는지 확인 후 DOM 업데이트
            document.getElementById(`itemName-${index}`).value = data.itemName || '-';
            document.getElementById(`price-${index}`).value = data.itemPrice || 0;
            document.getElementById(`stock-${index}`).value = data.stockQuantity ?? "-";
            updateTotal();
        } catch (error) {
            console.error(`Error fetching item info: ${error}`);
        }
    }
    //강동현 추가부분


    async function submitOrder() {
        const itemCodes = document.getElementsByName("itemCode");
        const quantities = document.getElementsByName("orderedQuantity");
        const items = [];
        for (let i = 0; i < itemCodes.length; i++) {
            const code = itemCodes[i].value.trim();
            const qty = parseInt(quantities[i].value.trim());
            if (code && qty > 0) {
                items.push({ itemCode: code, orderedQuantity: qty });
            }
        }
        if (items.length === 0) return alert("품목을 선택하고 수량을 입력하세요.");

        const res = await fetch('/storeOwner/storeOrder', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ items })
        });

        if (res.ok) {
            alert("주문 완료!");
            location.href = '/storeOwner/storeorderList';
        } else {
            alert("재고 부족: 수량을 확인해주세요\n" + res.statusText);
        }
    }

    // window.onload = () => {
    //     for (let i = 0; i < 3; i++) addRow();
    // };

    //강동현 수정 부분
    window.onload = () => {
        console.log("Window loaded, adding rows.");

        // URLSearchParams로 쿼리 파라미터 읽기
        const params = new URLSearchParams(window.location.search);
        const itemCodes = params.getAll('itemCode'); // 중복된 itemCode 모두 가져오기
        const neededs = params.getAll('needed');    // 중복된 needed 모두 가져오기

        console.log(`ItemCodes: ${itemCodes}, Neededs: ${neededs}`);

        if (itemCodes.length > 0 && neededs.length > 0) {
            // itemCode와 needed 배열을 기반으로 행 추가
            for (let i = 0; i < itemCodes.length; i++) {
                const itemCode = itemCodes[i];
                const needed = neededs[i];
                addRow(itemCode, needed); // 각각의 값으로 행 추가
            }
        } else {
            // URL 쿼리 파라미터가 없을 경우 기본적으로 3개의 빈 행 추가
            for (let i = 0; i < 3; i++) {
                addRow(); // 빈 값으로 행 추가
            }
        }
    };
    //강동현 수정 부분



</script>
</body>
</html>
