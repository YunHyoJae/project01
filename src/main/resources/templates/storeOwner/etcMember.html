<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{/storeOwner/meta::myHead('내가 한 질문')}"></head>
<body>
<header th:replace="~{/storeOwner/tnb}"></header>
<div class="section">
  <div th:replace="~{/storeOwner/header}"></div>


  <div class="main-layout">
<!--    <div th:replace="~{/storeOwner/etcLnb::active('etc','faq')}"></div>-->

    <!-- 본문 컨텐츠 -->
    <div class="content storeStatus">
      <h2>정보수정</h2>
      <form action="/storeOwner/member" method="post" th:object="${dto}">
        <input type="hidden" th:field="*{storeId}" readonly/>
        <input type="hidden" th:field="*{memberId}" readonly/>
        <input type="hidden" th:field="*{userPw}" />
        <table>
          <tr>
            <th><h3 class="tit">아이디</h3></th>
            <td><input type="text" th:field="*{userId}" readonly /></td>
            <th><h3 class="tit">이름</h3></th>
            <td><input type="text" th:field="*{userName}" />
              <p class="error" th:errors="*{userName}"></p>
            </td>
            <th><h3 class="tit">연락처</h3></th>
            <td><input type="text" name="tel" th:field="*{userTel}" class="write_tit">
              <p class="error" th:errors="*{userTel}"></p>
            </td>
          </tr>
          <tr>
            <th><h3 class="tit">이메일</h3></th>
            <td colspan="3"><input type="email" th:field="*{userEmail}" />
              <p class="error" th:errors="*{userEmail}"></p>
            </td>
            <th><h3 class="tit">우편번호</h3></th>
            <td>
              <div class="row">
              <div class="col-6"><input type="number" class="form-control" id="inputZipcode" readonly th:field="*{userZipcode}" /></div>
              <div class="col-6 p-0"><button class="btn btn-info" type="button" id="postBtn">우편번호</button></div>
            </div>
            </td>
          </tr>
          <tr>
            <th><h3 class="tit">주소</h3></th>
            <td colspan="2"><input type="text" class="form-control" id="inputAddress1" name="userAddress01" th:field="*{userAddress01}" /></td>
            <th><h3 class="tit">상세주소</h3></th>
            <td colspan="2"><input type="text" class="form-control" id="inputAddress2" name="userAddress02" th:field="*{userAddress02}" /></td>
          </tr>
        </table>
        private String state;
        <table>
          <tr>
            <th><h3 class="tit">상점명</h3></th>
            <td><input type="text" th:field="*{name}" readonly /></td>
            <th><h3 class="tit">사업자등록번호</h3></th>
            <td><input type="text" th:field="*{storeNumber}" /></td>
            <th><h3 class="tit">점포지역</h3></th>
            <td>
              <input type="text" th:field="*{space}" name="space" readonly />
            </td>
          </tr>
          <tr>
            <th><h3 class="tit">전화번호</h3></th>
            <td colspan="3"><input type="tel" th:field="*{tel}" />
              <p class="error" th:errors="*{tel}"></p>
            </td>
            <th><h3 class="tit">우편번호</h3></th>
            <td>
              <div class="row">
                <div class="col-6"><input type="number" class="form-control" id="inputZipcode22" readonly th:field="*{zipcode}" /></div>
                <div class="col-6 p-0"><button class="btn btn-info" type="button" id="postBtn22">우편번호</button></div>
              </div>
            </td>
          </tr>
          <tr>
            <th><h3 class="tit">주소</h3></th>
            <td colspan="2"><input type="text" class="form-control" id="inputAddress122" name="address01" th:field="*{address01}" /></td>
            <th><h3 class="tit">상세주소</h3></th>
            <td colspan="2"><input type="text" class="form-control" id="inputAddress222" name="address02" th:field="*{address02}" /></td>
          </tr>
        </table>
        <div class="write_btns">
          <button type="button" class="cancel-btn default_btn" onclick="window.history.back()">취소</button>
          <button type="submit" class="write-btn default_btn">작성</button>
        </div>
      </form>
    </div>
  </div>
</div>
<script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<script>
  const postBTN=document.querySelector("#postBtn");
  const postBTN22=document.querySelector("#postBtn22");
  postBTN.addEventListener("click",()=>{postcode('inputZipcode',"inputAddress1","inputAddress2")});
  postBTN22.addEventListener("click",()=>{postcode('inputZipcode22',"inputAddress122","inputAddress222")});
  function postcode(zipcode,address1,address2) {
    new daum.Postcode({
      oncomplete: function(data) {
        // 팝업에서 검색결과 항목을 클릭했을때 실행할 코드를 작성하는 부분.
        // 도로명 주소의 노출 규칙에 따라 주소를 표시한다.
        // 내려오는 변수가 값이 없는 경우엔 공백('')값을 가지므로, 이를 참고하여 분기 한다.
        var roadAddr = data.roadAddress; // 도로명 주소 변수
        var extraRoadAddr = ''; // 참고 항목 변수
        // 법정동명이 있을 경우 추가한다. (법정리는 제외)
        // 법정동의 경우 마지막 문자가 "동/로/가"로 끝난다.
        if(data.bname !== '' && /[동|로|가]$/g.test(data.bname)){extraRoadAddr += data.bname;}
        // 건물명이 있고, 공동주택일 경우 추가한다.
        if(data.buildingName !== '' && data.apartment === 'Y'){
          extraRoadAddr += (extraRoadAddr !== '' ? ', ' + data.buildingName : data.buildingName);
        }
        // 표시할 참고항목이 있을 경우, 괄호까지 추가한 최종 문자열을 만든다.
        if(extraRoadAddr !== ''){
          extraRoadAddr = ' (' + extraRoadAddr + ')';
        }
        // 우편번호와 주소 정보를 해당 필드에 넣는다.
        document.getElementById(zipcode).value = data.zonecode;
        document.getElementById(address1).value = roadAddr;
        //document.getElementById("sample4_jibunAddress").value = data.jibunAddress;
        // 참고항목 문자열이 있을 경우 해당 필드에 넣는다.
        if(roadAddr !== ''){
          document.getElementById(address2).value = extraRoadAddr;
        } else {
          document.getElementById(address2).value = '';
        }
        if(document.getElementById(zipcode).value==''){document.getElementById(zipcode).value=null}
      }
    }).open();
  }

</script>
</body>
</html>
