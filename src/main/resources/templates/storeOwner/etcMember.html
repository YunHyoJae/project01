<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{/storeOwner/meta::myHead('정보수정')}"></head>
<body>
<header th:replace="~{/storeOwner/tnb}"></header>
<div class="section">
  <div th:replace="~{/storeOwner/header}"></div>
  <div class="main-layout">
<!--    <div th:replace="~{/storeOwner/etcLnb::active('etc','faq')}"></div>-->

    <!-- 본문 컨텐츠 -->
    <div class="content">
      <div class="form-wrapper">
        <h2>정보수정</h2>
        <form class="editProfile" action="/storeOwner/member" method="post" th:object="${dto}">
      
        <input type="hidden" th:field="*{storeId}" readonly/>
        <input type="hidden" th:field="*{memberId}" readonly/>
        <input type="hidden" th:field="*{userPw}" />
        <div class="form-row two-columns-split">
          <!-- 왼쪽: 사용자 정보 -->
          <div>
            <div class="form-row">
              <label>아이디</label>
              <input type="text" th:field="*{userId}" readonly />
              <label>이름</label>
              <input type="text" th:field="*{userName}" />
            </div>
            <p class="error" th:errors="*{userName}"></p>          
            <div class="form-row">
              <label>연락처</label>
              <input type="text" name="tel" th:field="*{userTel}" class="write_tit" />
            </div>
            <p class="error" th:errors="*{userTel}"></p>    
            <div class="form-row">
              <label>이메일</label>
              <input type="email" th:field="*{userEmail}" />
            </div>
            <p class="error" th:errors="*{userEmail}"></p>
            <div class="form-row three-columns">
              <label for="user-postcode">우편번호</label>
              <input type="text" id="user-postcode" placeholder="우편번호" th:field="*{userZipcode}" readonly>
              <input type="button" onclick="execDaumPostcode('user')" value="주소 검색"/>
            </div>
            <div class="form-row address-combined">
              <label for="user-address">주소</label>
              <div class="address-group">
                <input type="text" id="user-address" placeholder="기본 주소" th:field="*{userAddress01}" readonly>
              <input type="text" id="store-detail-address" th:field="*{userAddress02}" placeholder="상세 주소를 입력하세요">
              </div>
            </div>
          </div>
          <div>
            <div class="form-row">
              <label>매장명</label>
              <input type="text" placeholder="매장명" th:field="*{name}" readonly />
              <label>사업자등록번호</label>
              <input type="text" th:field="*{storeNumber}" />
              <label>점포지역</label>
              <input type="text" th:field="*{space}" name="space" readonly />
            </div>
            <div class="form-row">
              <label>매장 전화번호</label>
              <input type="tel" placeholder="매장전화번호" th:field="*{tel}" />
            </div>
            <p class="error" th:errors="*{tel}"></p>

            <div class="form-row three-columns">
              <label for="store-postcode">우편번호</label>
              <input type="text" id="store-postcode" placeholder="우편번호" th:field="*{zipcode}" readonly>
              <input type="button" onclick="execDaumPostcode('store')" value="주소 검색"/>
            </div>

            <div class="form-row">
              <label for="store-address">주소</label>
              <input type="text" id="store-address" th:field="*{address01}" placeholder="기본 주소" readonly>
              <label for="store-detail-address">상세 주소</label>
              <input type="text" id="store-detail-address" th:field="*{address02}" placeholder="상세 주소를 입력하세요">
            </div>
            <div class="form-row checkbox-row">
              <label class="set">휴업 설정</label>
              <label class="checkbox-label">
                <input type="checkbox" th:field="*{stateBoolean}" />
                휴업 또는 폐업 설정
              </label>
            </div>
          </div>
        </div>
        <div class="check_btn">
          <input type="checkbox"/>
          <small>정보수정은 증빙서류를 첨부해주시면 검토 후 연락드립니다.</small>
        </div>
        <div class="form-actions">
          <button type="button" class="cancel" onclick="window.history.back()">취소</button>
          <button type="submit" class="submit">수정</button>
        </div>
      </form>
    </div>
  </div>
</div>
</body>
</html>
