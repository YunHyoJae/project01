<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>주문신청서</title>
</head>
<body>
  <!-- 본문 컨텐츠 -->
  <div class="orderForm">
    <h2 class="title">주문신청서</h2>
    <button class="addRow_btn" onclick="addRow()">행 추가 ➕</button>
    <div class="orderForm-box box">
      <table id="orderFormTable">
        <thead>
          <tr>
            <th><input type="checkbox" onclick='selectAll(this)'/></th>
            <th>주문번호</th>
            <th>품목코드</th>
            <th>품목명</th>
            <th></th>
            <th>수량</th>
            <th>재고</th>
            <th>단가</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          <!-- 샘플 데이터 -->
          <tr>
            <td><input type="checkbox"/></td>
            <td><input type="text"></td>
            <td><input type="text" class="pd_code"></td>
            <td><input type="text" class="pd_name"></td>
            <td class="search_td"><button class="default_btn" onclick="showModal(this)">검색</button></td>
            <td><input type="number"></td>
            <td><input type="number"></td>
            <td><input type="text"></td>
            <td><button onclick="deleteRow(this)">❌</button></td>
          </tr>
          <tr>
            <td><input type="checkbox"/></td>
            <td><input type="text"></td>
            <td><input type="text" class="pd_code"></td>
            <td><input type="text" class="pd_name"></td>
            <td class="search_td"><button class="default_btn" onclick="showModal(this)">검색</button></td>
            <td><input type="number"></td>
            <td><input type="number"></td>
            <td><input type="text"></td>
            <td><button onclick="deleteRow(this)">❌</button></td>
          </tr>
          <tr>
            <td><input type="checkbox"/></td>
            <td><input type="text"></td>
            <td><input type="text" class="pd_code"></td>
            <td><input type="text" class="pd_name"></td>
            <td class="search_td"><button class="default_btn" onclick="showModal(this)">검색</button></td>
            <td><input type="number"></td>
            <td><input type="number"></td>
            <td><input type="text"></td>
            <td><button onclick="deleteRow(this)">❌</button></td>
          </tr>
          <tr>
            <td><input type="checkbox"/></td>
            <td><input type="text"></td>
            <td><input type="text" class="pd_code"></td>
            <td><input type="text" class="pd_name"></td>
            <td class="search_td"><button class="default_btn" onclick="showModal(this)">검색</button></td>
            <td><input type="number"></td>
            <td><input type="number"></td>
            <td><input type="text"></td>
            <td><button onclick="deleteRow(this)">❌</button></td>
          </tr>
          <tr>
            <td><input type="checkbox"/></td>
            <td><input type="text"></td>
            <td><input type="text" class="pd_code"></td>
            <td><input type="text" class="pd_name"></td>
            <td class="search_td"><button class="default_btn" onclick="showModal(this)">검색</button></td>
            <td><input type="number"></td>
            <td><input type="number"></td>
            <td><input type="text"></td>
            <td><button onclick="deleteRow(this)">❌</button></td>
          </tr>
          <tr>
            <td colspan="3">총 금액</td>
            <td colspan="6"></td>
          </tr>
        </tbody>
      </table>
      <button class="default_btn apply_btn">신청</button>
    </div>
    <!-- modal -->
    <div class="modalBox">
      <div id="modalBg">
        <div class="modal">
          <h2>품목 검색</h2>
          <button class="close_btn"onclick="document.getElementById('modalBg').style.display = 'none'">❌</button>
          <form action="">
            <select name="" id="searchProduct" onChange="getSelect()">
              <option value="product_code" selected>품목 코드</option>
              <option value="product_name">품목명</option>
            </select>
            <div class="code_box">
              <input type="text" id="inputCode">
              <button onclick="getInput(event)">검색</button>
            </div>
            <div class="name_box">
              <input type="text" id="inputName"/>
              <button onclick="getInput(event)">검색</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
