<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>매장별 재고 현황</title>
  <link rel="stylesheet" href="../css/inventory_manager_style.css" />
  <script src="../js/manager.js" defer></script>
</head>
<body>
  <div class="inventoryStatus">
    <!-- 본문 컨텐츠 -->
    <div class="content_01" id="on">
      <h2>매장별 재고 현황</h2>
      <div class="search-bar">
        <select>
          <option>품목명</option>
        </select>
        <input type="text" placeholder="매장명" />
        <button>검색</button>
      </div>

      <table class="stock-table">
        <thead>
          <tr>
            <th>품목코드</th>
            <th>품목명</th>
            <th>합계</th>
            <th>본사창고</th>
            <th>강남매장</th>
            <th>강동매장</th>
            <th>강서매장</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>A001</td>
            <td>아라비카원두</td>
            <td>100</td>
            <td>200</td>
            <td>300</td>
            <td>400</td>
            <td>500</td>
          </tr>
          <tr>
            <td>A002</td>
            <td>12온스종이컵</td>
            <td>4000</td>
            <td>300</td>
            <td>500</td>
            <td>50</td>
            <td>60</td>
          </tr>
          <tr>
            <td>A003</td>
            <td>커피스틱(대)</td>
            <td>1000</td>
            <td>50</td>
            <td class="low">10</td>
            <td class="low">6</td>
            <td>70</td>
          </tr>
          <tr>
            <td>A004</td>
            <td>핫음료뚜껑(소)</td>
            <td>1000</td>
            <td>0</td>
            <td class="low">5</td>
            <td class="low">5</td>
            <td>70</td>
          </tr>
        </tbody>
      </table>
    </div>
    <div class="content_02">
      <form>
        <h2>기초 품목 등록</h2>

        <div class="row">
          <label>
            품목코드
            <input type="text" name="itemCode" placeholder="품목코드" />
            <button type="button">중복확인</button>
          </label>
        </div>

        <div class="row">
          <label class="label-itemName">
            품목명
            <input type="text" name="itemName" placeholder="품목명" />
          </label>
        </div>




        <div class="group-row">
          <span class="group-label">품목그룹</span>
          <label><input type="radio" name="group" value="본사관리" /> 본사관리</label>
          <label><input type="radio" name="group" value="매장관리" /> 매장관리</label>
          <label><input type="radio" name="group" value="관리" /> 관리</label>
        </div>


        <!-- 단위 선택 부분 -->
        <div class="unit-form">
          <label for="unitSelect">단위
            <select id="unitSelect" name="unit">
              <option value="">-- 단위를 선택하세요 --</option>
              <option value="개">개</option>
              <option value="박스">박스</option>
              <option value="kg">kg</option>
              <option value="g">g</option>
              <option value="L">L</option>
              <option value="ml">ml</option>
              <option value="봉지">봉지</option>
              <option value="묶음">묶음</option>
              <option value="custom">직접 입력</option>
            </select>

            <input type="text" id="customUnitInput" name="customUnit" class="hidden" placeholder="단위를 직접 입력하세요" />
        </div>


        <label class="label-gap">
          단가
          <input type="text" name="price" placeholder="단가" />
        </label>

        <div class="type-row">
          <span class="type-label">품목구분</span>
          <label><input type="radio" name="type" value="원재료" /> 원재료</label>
          <label><input type="radio" name="type" value="부재료" /> 부재료</label>
          <label><input type="radio" name="type" value="자재" /> 자재</label>
        </div>
        <br>
        <label>
          유통기한
          <input type="text" name="expire" placeholder="등록일로부터의 +day 입력" />
        </label>
        <br>
        <div style="text-align: left;">
          <button type="submit" class="ask-btn">등록</button>
        </div>

      </form>

    </div>


    <div class="content_03">
      <h2>메뉴등록</h2>
      <form class="menu-form">
        <div class="form-row">
          <label>메뉴ID</label>
          <input type="text" placeholder="메뉴 ID" />
          <button type="button" class="check-btn">중복확인</button>
        </div>

        <div class="form-row">
          <label>메뉴이름</label>
          <input type="text" placeholder="메뉴 이름 등록" />
        </div>

        <div class="form-row">
          <label>판매가</label>
          <input type="text" placeholder="판매가격" />
        </div>

        <div class="form-row item-row">
          <label>품목코드</label>
          <input type="text" placeholder="품목코드" />
          <span>사용량</span>
          <input type="text" placeholder="사용량" />
          <button type="button" class="add-btn">➕</button>
        </div>

        <div class="form-row item-row">
          <label class="invisible-label">품목코드</label>
          <input type="text" placeholder="품목코드" />
          <span>사용량</span>
          <input type="text" placeholder="사용량" />
        </div>

        <div style="text-align: left;">
          <button type="submit" class="ask-btn">등록</button>
        </div>
      </form>
    </div>
  </div>

</body>

</html>
